<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <!-- import CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        a{
            text-decoration-line: none;
            color: #6c6c6c;
        }
        .el-table .el-table__cell{
            /*移除 Element UI 表格单元格内边距*/
            padding: 0;}
    </style>
</head>
<body>
<div id="app">
    <div style="width:1200px;margin: 0 auto">
        <!--     vertical-align: middle ==>图片同一行垂直居中-->
        <img src="../imgs/logo.png" alt="logo" width="300px" style="vertical-align: middle">
        <span><a href="#">首页</a></span>
        <el-divider direction="vertical"></el-divider>
        <span><a href="#">热点资讯</a></span>
        <el-divider direction="vertical"></el-divider>
        <span><a href="#">店家入驻</a></span>
        <el-divider direction="vertical"></el-divider>
        <span><a href="#">社会招聘</a></span>
        <el-divider direction="vertical"></el-divider>
        <span><a href="#">校园招聘</a></span>
        <el-divider direction="vertical"></el-divider>
        <span><a href="#">帮助</a></span>
    </div>
    <div style="background-color: #89C8EB">
        <div>
            <el-menu style="width:1200px;margin: 0 auto"
                     :default-active="activeIndex2"
                     class="el-menu-demo" mode="horizontal"
                     @select="handleSelect"
                     background-color="#89C8EB"
                     text-color="#fff" active-text-color="#F4F3F3"
            >
                <el-menu-item v-for="(item,i) in categoryArr"
                              :key="item.id"
                              :index="item.id.toString()">
                    {{item.name}}
                </el-menu-item>
                <div style="float: right">
                    <el-input placeholder="请输入内容"
                              v-model="keyword"
                              style="width: 300px;margin-left: 20px;margin-top: 10px" >
                        <el-button slot="append" type="primary"
                                   icon="el-icon-search"
                                   @click="searchProduct"
                        ></el-button>
                    </el-input>
                </div>
            </el-menu>
        </div>
    </div>
    <div style="width:1200px;margin: 0 auto" >
        <el-row :gutter="20" >
            <el-col :span="18" style=""><div>
                <template style="height: 300px;">
                    <el-carousel  height="300px">
                        <el-carousel-item v-for="(item,i) in bannerArr">

                            <img :src="item.url" :fit="fit" width="100%" height="100%"
                                 style="cursor: pointer;"
                                 @click="goToCategory(item.categoryId)"
                            >
                        </el-carousel-item>
                    </el-carousel>
                </template>
            </div></el-col>
            <el-col :span="6">
                <el-card height="300px">
                    <h3><i class="el-icon-trophy" style="font-weight: bold"></i>销量最高</h3>
                    <el-divider></el-divider>
                    <el-table :data="topArr"
                              @row-click="handleTopRowClick"
                              style="cursor: pointer;"
                    >
                        <el-table-column label="排名" type="index" width="50"></el-table-column>
                        <el-table-column label="商品名" prop="title" width="80"></el-table-column>
                        <el-table-column label="销量" prop="saleCount" width="80"></el-table-column>
                    </el-table>
                </el-card>
            </el-col>
        </el-row>
    </div>
    <div style="width:1200px;margin: 0 auto">
        <el-row :gutter="20">
            <el-col :span="6" v-for="(o, index) in productArr" style="margin-top: 20px">
                <el-card >
                    <img :src="o.url" width="100%" style="cursor: pointer;" @click="goToDetail(o.id)">
<!--                    cursor 鼠标手型-->
                    <div>
                        <span style="font-size: 12px">{{o.title}}</span>
                        <div>
                            <span style="font-size: 20px;margin-top: 0">{{"￥"+o.price}}</span>
                            <span style="text-decoration: line-through" >{{o.oldPrice}}</span>
                            <span style="float: right;font-size: 20px">{{"销量:"+o.saleCount}}</span>
                        </div>

                    </div>
                </el-card>
            </el-col>
        </el-row>
    </div>
    <el-footer >
        <div>
            <img src="../imgs/wave.png">
        </div>
        <div  style="background-color: #3f3f3f;color: #b1b1b1;text-align: center;padding: 30px 0">
            <p>Copyright&copy 江苏万和系统工程有限公司版权所有苏ICP备12003709号-3苏公网安备11010802029572号</p>
            <p>涵盖20余门课程体系，致力于打造权威的IT职业教育学习平台</p>
            <p>万和在线WWW.WANHO.ORG 专注于IT职业技能培训</p>
        </div>
    </el-footer>
</div>
</div>
</body>
<!-- 引入axios框架-->
<script src="https://cdn.bootcdn.net/ajax/libs/axios/0.21.1/axios.min.js"></script>

<!-- import Vue before Element -->
<script src="https://unpkg.com/vue@2/dist/vue.js"></script>
<!-- import JavaScript -->
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script>
    let v=new Vue({
        el:'#app',
        data:function () {
            return{
                categoryArr:[],
                bannerArr:[],
                topArr:[],
                productArr:[],
                activeIndex2: '1',
                fit: 'cover',
                keyword:'',//搜索关键字
            }
        },
        methods:{
            handleRemove(file, fileList) {
                console.log(file, fileList);
            },
            handleSelect: function(index) {
                // index 是分类的 id（字符串形式）
                // 找到对应的分类对象
                let category = this.categoryArr.find(item => item.id.toString() === index);
                if (category) {
                    // 跳转到 result.html，传递分类ID和名称
                    window.location.href = 'result.html?categoryId=' + category.id + '&categoryName=' + encodeURIComponent(category.name);
                }
            },
            // 搜索商品
            searchProduct: function() {
                //trim()方法用于去除字符串两端的空格
                const kw = this.keyword && this.keyword.trim();
                if (!kw) {
                    // 关键字为空时，恢复为全部商品
                    axios.get("/product/select").then(function (res){
                        v.productArr = res.data;
                    });
                    return;
                }
                axios.get("/product/search", {
                    params: { keyword: kw }
                }).then(function (res){
                    v.productArr = res.data;
                });
            },
            //点击轮播图跳转到分类页
            goToCategory: function(categoryId) {
                if (categoryId) {
                    // 找到对应的分类名称
                    let category = this.categoryArr.find(item => item.id === categoryId);
                    if (category) {
                        window.location.href = 'result.html?categoryId=' + categoryId + '&categoryName=' + encodeURIComponent(category.name);
                    } else {
                        // 如果分类列表还没加载完，直接跳转（名称可能显示为空）
                        window.location.href = 'result.html?categoryId=' + categoryId;
                    }
                }
            },
            // 点击销量最高表格行
            handleTopRowClick: function(row) {
                const productId = row.productId;
                if (productId) {
                    this.goToDetail(productId);
                }
            },
            // 跳转到详情页
            goToDetail: function(productId) {
                window.location.href = 'detail.html?productId=' + productId;
            }
        },
        created:function (){
            axios.get("/category/select").then(function (res){
                v.categoryArr=res.data
            });
            axios.get("/product/select").then(function (res){
                v.productArr=res.data
            });
            axios.get("/top/select").then(function (res){
                v.topArr=res.data
                console.log(res.data);
            });
            axios.get("/banner/select").then(function (res){
                v.bannerArr=res.data
            });
        },

    })
</script>
</html>
